services:
  - type: web
    name: virtual-bank-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python api/manage.py collectstatic --noinput
    startCommand: cd api && python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT virtual_bank.asgi:application
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEV
        value: "False"
      - key: DB_NAME
        fromDatabase:
          name: virtual-bank-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: virtual-bank-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: virtual-bank-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: virtual-bank-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: virtual-bank-db
          property: port
      - key: REDIS_URL
        fromService:
          name: virtual-bank-redis
          type: keyvalue
          property: connectionString
        value: https://rpc.vscblockchain.org
        value: https://420042.rpc.thirdweb.com
        value: https://explorer.vscblockchain.org/api
      - key: API_HOST
        value: virtual-bank-api.onrender.com
      - key: API_PORT
        value: "443"
      - key: API_URL
        value: https://virtual-bank-api.onrender.com

  - type: web
    name: virtual-bank-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.client
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEV
        value: "False"
      - key: DB_NAME
        fromDatabase:
          name: virtual-bank-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: virtual-bank-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: virtual-bank-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: virtual-bank-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: virtual-bank-db
          property: port
      - key: API_URL
        value: https://virtual-bank-api.onrender.com
      - key: PUBLIC_API_URL
        value: https://virtual-bank-api.onrender.com

  - type: keyvalue
    name: virtual-bank-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: virtual-bank-db
    plan: free
    databaseName: virtual_bank
    user: virtual_bank

# The API and customer-facing web app share the PostgreSQL database.
