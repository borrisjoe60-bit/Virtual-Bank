name: VSC integration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/vector-smart-chain-multichain"]

jobs:
  django-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: virtualbank
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d virtualbank"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check VSC dashboard JavaScript syntax
        run: node --check clients/users/static/users/scripts/vsc-dashboard.js
      - name: Check Python syntax
        run: python -m compileall -q api/vsc_wallet
      - name: Django system checks
        working-directory: api
        env:
          SECRET_KEY: ci-only-secret-key
          DB_NAME: virtualbank
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          VSC_RPC_URL: https://rpc.vscblockchain.org
        run: python manage.py check
      - name: Run VSC tests
        working-directory: api
        env:
          SECRET_KEY: ci-only-secret-key
          DB_NAME: virtualbank
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
        run: python manage.py test vsc_wallet
