{% extends "users/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="aurex-page">
  <div class="aurex-page-heading"><span class="aurex-kicker">ACCOUNT SECURITY</span><h1>Change password</h1><p>Choose a strong password you do not use elsewhere.</p></div>
  <form method="post" class="aurex-panel">{% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-danger mt-3" type="submit">Update password</button>
  </form>
  <a class="aurex-back-link" href="{% url 'users:settings' %}">← Back to settings</a>
</div>
{% endblock %}
